# Portainer-Git-Stack (Docker Standalone, Build-Methode "Repository"), ohne GitOps-Autoupdate.
# Das Image baut GitHub Actions (.github/workflows/docker-publish.yml) und legt es auf ghcr.io ab.
# Ist das Package auf ghcr.io privat, braucht Portainer unter "Registries" einen ghcr.io-Eintrag
# mit einem GitHub-Token (Scope "read:packages").
services:
  unifi-mcp:
    image: ghcr.io/kdt-solutions/unifi-mcp:${UNIFI_MCP_TAG:-latest}
    # Bei jedem Deploy/Redeploy das Image neu ziehen statt einer veralteten lokalen :latest-Kopie.
    pull_policy: always
    container_name: unifi-mcp
    restart: unless-stopped
    init: true
    # Härtung: unprivilegierter Benutzer (siehe Dockerfile), read-only Root-Dateisystem, keine
    # Capabilities. security_opt fehlt bewusst: Portainer lehnt es für Nicht-Administratoren ab.
    read_only: true
    cap_drop:
      - ALL
    environment:
      MCP_API_KEY: ${MCP_API_KEY}
      SITE_MANAGER_API_KEY: ${SITE_MANAGER_API_KEY}
      # Integration-Keys und Legacy-Zugangsdaten aller Konsolen als ein JSON-Objekt
      # {"UNIFI_KEY_KUNDE_B": "...", ...}; die Namen stehen in consoles.json (api_key_env usw.).
      UNIFI_CONSOLE_SECRETS: ${UNIFI_CONSOLE_SECRETS:-}
      MCP_PATH: ${MCP_PATH:-/unifi}
      # Konsolen-Liste als JSON (Aufbau wie config/consoles.example.json). Ist die Variable leer,
      # liest der Dienst /config/consoles.json (Datei per Volume einbinden, siehe README).
      CONSOLES_JSON: ${CONSOLES_JSON:-}
      CONSOLES_FILE: /config/consoles.json
      DATA_DIR: /data
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-120}
      MCP_AUTH_FAIL_LIMIT_PER_MINUTE: ${MCP_AUTH_FAIL_LIMIT_PER_MINUTE:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Audit-Log, Pläne und Sicherungen vor Änderungen (übersteht Redeploys).
      - unifi-mcp-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    ports:
      # Zugriff nur über den Reverse-Proxy (TLS macht Nginx Proxy Manager). MCP_BIND_ADDR auf die
      # Host-IP setzen, über die NPM den Dienst erreicht; ohne Angabe nur auf 127.0.0.1.
      - "${MCP_BIND_ADDR:-127.0.0.1}:${MCP_HOST_PORT:-8438}:8000"
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  unifi-mcp-data:
